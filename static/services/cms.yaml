          - OBJECT_ADDITIONAL_PROPERTIES
          - OBJECT_DEPENDENCY_KEY
          - ONE_OF_MISSING
          - ONE_OF_MULTIPLE
          - NOT_PASSED
          - INVALID_FORMAT
          - INVALID_CREDENTIALS
          - INVALID_TYPE
          - UNKNOWN_FORMAT
          - PATTERN
          - REQUIRED
      message:
        type: string
