        type: string
        description: machine readable error code
      message:
        type: string
        description: human readable error code
      validationErrors:
        type: array
        items:
          type: object
          properties:
            code:
              type: string
            reason:
              type: string
            entity:
              type: string
            entityId:
              type: string
            entityIndex:
              type: number
            subentityPath:
              type: array
              items:
                type:
                  - string
                  - number
    x-stoplight:
      id: 56egilahxv2lb
  DeprovisioningRequest:
    type: object
    additionalProperties: false
    required:
      - deleteRequestId
    properties:
