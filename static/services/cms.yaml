swagger: '2.0'
x-stoplight:
  id: hakx5tqv6idhx
info:
  title: CMS Service
  version: '1.0'
  contact:
    name: Shopgate API
    url: 'https://shopagte.com'
    email: support@shopgate.com
  description: >-
    The CMS Service manages content delivery for the Shopgate mobile shopping apps. 
    It follows a hierarchical structure: Merchants own Shops, and Shops contain Pages and Media Assets.


    **Key Features:**

    * **Lifecycle Management**: Support for creating drafts, versioning, and publishing.

    * **Modular Widgets**: Pages are built using Widgets, which include global settings like scheduling (`visibility`), manual toggles (`isHidden`), and layout padding.

    * **Dynamic Config**: Widget configurations (`widgetConfig`) with possibilities for visibility logic (e.g. only show one field if another field has value x).

    * **Localization**: Full support for multi-language content via `localeCode` parameters.


    For detailed widget schemas and visibility syntax, refer to the [Widget Configuration Guide](../../markdown/references/cms/widget-configs.md).
host: cms.shopgate.io
schemes:
  - https
basePath: /v1
produces:
  - application/json
consumes:
  - application/json
paths:
  '/merchants/{merchantCode}':
    parameters:
      - name: merchantCode
        in: path
        type: string
        required: true
    delete:
      operationId: deleteMerchantEntities
      summary: Deprovision Merchant
      description: Deletes a merchant and all associated entities from the CMS. This action is irreversible and should be used for full offboarding.
      x-internal: true
      tags:
        - Deprovisioning
      parameters:
        - in: body
          name: body
          schema:
            $ref: '#/definitions/DeprovisioningRequest'
      responses:
        '204':
          description: Delete request accepted
        '403':
          description: Access denied
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Merchant not found
          schema:
            $ref: '#/definitions/Error'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
      x-stoplight:
        id: 85s9u5omkhgvw
  '/merchants/{merchantCode}/shops/{shopCode}':
    parameters:
      - name: merchantCode
        in: path
        type: string
        required: true
      - name: shopCode
        in: path
        type: string
        required: true
    delete:
      operationId: deleteShopEntities
      summary: Deprovision Shop
      description: Deletes a specific shop and its associated CMS data. This will remove all pages and configurations linked to this shop code.
      x-internal: true
      tags:
        - Deprovisioning
      parameters:
        - in: body
          name: body
          schema:
            $ref: '#/definitions/DeprovisioningRequest'
      responses:
        '204':
          description: Delete request accepted
        '403':
          description: Access denied
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Merchant or shop not found
          schema:
            $ref: '#/definitions/Error'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
      x-stoplight:
        id: co1p76s1cmvn1
  '/merchants/{merchantCode}/shops/{shopCode}/widgetConfigDefinitions':
    parameters:
      - $ref: '#/parameters/MerchantCode'
      - $ref: '#/parameters/ShopCode'
    get:
      tags:
        - Widget Config Definitions
      operationId: getWidgetConfigDefinitions
      summary: Get widget config definitions
      description: Returns the list of available widgets and their configuration schemas for the specified shop and locale.
      parameters:
        - $ref: '#/parameters/LocaleCode'
        - $ref: '#/parameters/PaginationLimit'
        - $ref: '#/parameters/PaginationOffset'
      responses:
        '200':
          description: widget config definitions
          schema:
            type: object
            required:
              - widgetConfigDefinitions
              - meta
            properties:
              meta:
                $ref: '#/definitions/Pagination'
              widgetConfigDefinitions:
                $ref: '#/definitions/WidgetConfigDefinitionResolved'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/NotFoundError'
      x-stoplight:
        id: p9lnvxp0ia7rj
  '/merchants/{merchantCode}/shops/{shopCode}/pages':
    parameters:
      - $ref: '#/parameters/MerchantCode'
      - $ref: '#/parameters/ShopCode'
    post:
      tags:
        - Pages
      operationId: createPages
      summary: Create New Pages
      description: Bulk-creates one or more new CMS pages. Requires a unique slug and page code for each entry.
      parameters:
        - in: body
          name: body
          schema:
            type: object
            required:
              - pages
            properties:
              pages:
                type: array
                items:
                  $ref: '#/definitions/PageCreate'
      responses:
        '200':
          description: create pages response
          schema:
            type: object
        '400':
          description: Validation error or config validation error
          schema:
            allOf:
              - $ref: '#/definitions/ConfigValidationError'
              - $ref: '#/definitions/ValidationError'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/NotFoundError'
      x-stoplight:
        id: 2355ck56grz0l
    get:
      tags:
        - Pages
      operationId: getPages
      summary: List pages
      description: Retrieves a list of all pages for a shop. Supports filtering by status or metadata and custom sorting.
      parameters:
        - $ref: '#/parameters/PaginationLimit'
        - $ref: '#/parameters/PaginationOffset'
        - $ref: '#/parameters/Sort'
        - in: query
          name: filters
          type: string
          description: Filter string
          format: json
      responses:
        '200':
          description: get pages response
          schema:
            type: object
            required:
              - pages
              - meta
            properties:
              pages:
                type: array
                items:
                  $ref: '#/definitions/PageGet'
              meta:
                $ref: '#/definitions/Pagination'
      x-stoplight:
        id: m49wsutueqca1
  '/merchants/{merchantCode}/shops/{shopCode}/pages/{slug}/resolved':
    parameters:
      - $ref: '#/parameters/MerchantCode'
      - $ref: '#/parameters/ShopCode'
      - $ref: '#/parameters/Slug'
      - $ref: '#/parameters/LocaleCode'
    get:
      tags:
        - Pages
      operationId: getPublishedPage
      summary: Get Live Page Content
      description: Fetches the fully resolved (published & localized) version of a page by its slug.
      responses:
        '200':
          description: get published page response
          schema:
            type: object
            properties:
              page:
                $ref: '#/definitions/PageGetResolved'
      x-stoplight:
        id: dkycipdoreh7f
  '/merchants/{merchantCode}/shops/{shopCode}/pages/{pageCode}':
    parameters:
      - $ref: '#/parameters/MerchantCode'
      - $ref: '#/parameters/ShopCode'
      - $ref: '#/parameters/PageCode'
    get:
      tags:
        - Pages
      operationId: getNextPage
      summary: Retrieve Current Page Draft
      description: Gets the current working draft of a specific page.
      responses:
        '200':
          description: get next page response
          schema:
            type: object
            properties:
              page:
                $ref: '#/definitions/PageGet'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/NotFoundError'
      x-stoplight:
        id: 6ddrjg969k5ur
    post:
      tags:
        - Pages
      operationId: updateNextPage
      summary: Update Page Draft
      description: Updates the current page draft. Does not affect the live site until published.
      parameters:
        - in: body
          name: body
          schema:
            $ref: '#/definitions/PageUpdate'
      responses:
        '204':
          description: update next page response
        '400':
          description: Validation error
          schema:
            $ref: '#/definitions/ValidationError'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/NotFoundError'
      x-stoplight:
        id: t8u2wfxnpee1n
    delete:
      tags:
        - Pages
      operationId: deletePage
      summary: Delete Page
      description: Permanently removes a page and all its versions from the CMS.
      responses:
        '204':
          description: delete page response
      x-stoplight:
        id: phoosn3iul63b
  '/merchants/{merchantCode}/shops/{shopCode}/pages/{pageCode}/publish':
    parameters:
      - $ref: '#/parameters/MerchantCode'
      - $ref: '#/parameters/ShopCode'
      - $ref: '#/parameters/PageCode'
    post:
      tags:
        - Pages
      operationId: publishNextPage
      summary: Publish Page Draft
      description: Takes the current draft and makes it the "Live" version. Allows for an optional description to track changes in the version history.
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              description:
                type: string
                maxLength: 255
      responses:
        '204':
          description: publish next page response
        '400':
          description: Validation error
          schema:
            $ref: '#/definitions/ValidationError'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/NotFoundError'
      x-stoplight:
        id: 78l2i4gynykvv
  '/merchants/{merchantCode}/shops/{shopCode}/pages/{pageCode}/versions':
    parameters:
      - $ref: '#/parameters/MerchantCode'
      - $ref: '#/parameters/ShopCode'
      - $ref: '#/parameters/PageCode'
    get:
      tags:
        - Pages
      operationId: getPublishedPageVersions
      summary: List Page History
      description: Returns a history of the published versions for a specific page, including version numbers and creation dates.
      parameters:
        - $ref: '#/parameters/PaginationLimit'
        - $ref: '#/parameters/PaginationOffset'
      responses:
        '200':
          description: Versions of a page
          schema:
            type: object
            required:
              - versions
              - meta
            properties:
              versions:
                type: array
                items:
                  $ref: '#/definitions/VersionGet'
              meta:
                $ref: '#/definitions/Pagination'
      x-stoplight:
        id: lfgdeyxqzav7l
  '/merchants/{merchantCode}/shops/{shopCode}/pages/{pageCode}/versions/{versionNumber}':
    parameters:
      - $ref: '#/parameters/MerchantCode'
      - $ref: '#/parameters/ShopCode'
      - $ref: '#/parameters/PageCode'
      - $ref: '#/parameters/VersionNumber'
    get:
      tags:
        - Pages
      operationId: getPublishedPageVersion
      summary: Get Specific Published Version
      description: Retrieves the full configuration of a published page as it existed at a specific version number.
      responses:
        '200':
          description: Version of a page
          schema:
            type: object
            properties:
              page:
                $ref: '#/definitions/PageGet'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/NotFoundError'
      x-stoplight:
        id: d5e3t8wfkfoht
  '/merchants/{merchantCode}/images':
    parameters:
      - $ref: '#/parameters/MerchantCode'
    post:
      summary: Upload Image Asset
      description: Uploads an image to the Shopgate CDN. Returns a base URL that can be used within widget configurations.
      consumes:
        - multipart/form-data
      parameters:
        - in: formData
          name: file
          type: file
          required: true
          description: The file to upload. Must be eiter a .jpg or .png file.
      tags:
        - Images
      responses:
        '200':
          description: url of the uploaded file
          schema:
            type: object
            properties:
              baseUrl:
                type: string
        '400':
          description: Validation error
          schema:
            $ref: '#/definitions/ValidationError'
        '403':
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Merchant not found
          schema:
            $ref: '#/definitions/NotFoundError'
      x-stoplight:
        id: j9un8abbrwr4y
parameters:
  MerchantCode:
    name: merchantCode
    in: path
    type: string
    required: true
    maxLength: 255
  ShopCode:
    name: shopCode
    in: path
    type: string
    required: true
    maxLength: 255
  LocaleCode:
    in: query
    name: localeCode
    description: 'Locale code to change the language of the name, descriptions, properties and media'
    type: string
    maxLength: 5
  PageCode:
    name: pageCode
    in: path
    type: string
    required: true
    maxLength: 255
  Slug:
    name: slug
    in: path
    type: string
    required: true
    maxLength: 255
  PaginationLimit:
    description: the limit of entries of one page
    in: query
    name: limit
    type: integer
    default: 100
    minimum: 1
    maximum: 100
  PaginationOffset:
    description: the offset where to start the page
    in: query
    name: offset
    type: integer
    default: 0
    minimum: 0
  Sort:
    description: sorting of pages
    in: query
    name: sort
    type: string
  VersionNumber:
    description: Number of the page version
    in: path
    name: versionNumber
    type: integer
    required: true
    minimum: 1
