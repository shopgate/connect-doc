        $ref: '#/definitions/IsProtected'
      dropzones:
        type: object
        properties:
          cmsWidgetList:
            type: array
            items:
              $ref: '#/definitions/Widget'
    x-stoplight:
      id: ysx0faexvoz0j
  Name:
