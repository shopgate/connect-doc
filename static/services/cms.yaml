    x-stoplight:
      id: ar6ezerj3dfqo
  Error:
    type: object
    required:
      - message
    properties:
      code:
        type: string
        description: machine readable error code
      message:
        type: string
        description: human readable error code
    x-stoplight:
      id: vifrqjy527uwl
  ConfigValidationError:
    type: object
    properties:
