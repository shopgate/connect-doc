                    - title: ' get_reviews'
                      route:
                        path: /get-reviews
                      data:
                        blocks:
                          - type: text
                            data: 'This allows you to export reviews from your shop system to the [Shopgate Reviews XML Format](/references/cart-integration/catalog-data-feed/review-xml).'
                            header:
                              token: POST
                              title: ' get_reviews'
                          - type: text
                            data: '## Query parameters'
                          - type: jsonSchema
                            data:
                              type: object
                              properties:
                                action:
                                  type: string
                                  default: get_reviews
                                  description: Requested method
                                shop_number:
                                  type: string
                                  description: |-
                                    Your shop number.
                                    Example: "11413"
                                trace_id:
                                  type: string
                                  description: |-
                                    Unique request trace ID.
                                    Example: "sma-9412"
                                offset:
                                  type: integer
                                  description: 'Number of items (not item number, etc) to be skipped in the export.'
                                limit:
                                  type: integer
                                  description: Maximum number of items to be exported.
                                uids:
                                  type: array
                                  description: |-
                                    The ids of products that should not be included in exported file.
                                    Example: ["10001","10002"]
                                  items:
                                    type: string
                              required:
                                - action
                                - shop_number
                                - trace_id
                                - uids
                            header: {}
                            config:
