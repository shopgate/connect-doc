pages:
  /:
    title: Home
    data:
      blocks:
        - type: text
          data: |-
            # Welcome to your new hub. 

            Its kind of empty in here - click the "Toggle Editor" button at the top of the editor to switch to edit mode to add new pages, content, and subpages!

            Use references to power parts of your Hub with other files in this project (like Modeling/OAS/Swagger files).
      children:
        - title: Merchant API
          route:
            path: /merchant-api
          data:
            children:
              - title: Order
                route:
                  path: /order
                data:
                  blocks: []
                  children:
                    - title: get_orders
                      route:
                        path: /get-orders
                      data:
                        blocks:
                          - type: text
                            data: 'This method returns a complete order list. The date_from and date_to parameters can be used to set a date range. The limit parameter limits the number of results, with 100 as the maximum value. The offset parameters indicates the number of results to be skipped.'
                            header:
                              token: POST
                              title: get_orders
                          - type: text
                            data: '## Query parameters'
                          - type: jsonSchema
                            data:
                              type: object
                              properties:
                                action:
                                  type: string
                                  default: get_orders
                                  description: Requested method
                                shop_number:
                                  type: string
                                  description: |-
                                    Your shop number.
                                    Example: "10123"
                                date_from:
                                  type: string
                                  description: |-
                                    Start date of the query. (Format ISO 8601).
                                    Example: "2012-01-15T09:53:50+01:00"
                                  format: date
                                date_to:
                                  type: string
                                  description: |-
                                    End date of the query. (Format ISO 8601).
                                    Example: "2012-02-20T10:12:47+01:00"
                                limit:
                                  type: integer
                                  description: 'Number of results to be returned from the query. (Default = 50, Max = 100)'
                                offset:
                                  type: integer
                                  description: Number of results to be skipped. Can be used to browse through the results. (Default = 0)
                                order_numbers:
                                  type: array
                                  description: "Limits the results to the order numbers entered in the parameter.\t\nExample: order_numbers[0]=\"1012001234\", order_numbers[1]=\"1012001235\""
                                  items:
                                    type:
                                      - string
                                      - array
                                    items: {}
                                with_items:
                                  type: boolean
                                  description: Setting this parameter to 1 retrieves every order's items. (Default = 0)
                                trace_id:
                                  type: string
                                  description: |-
                                    A unique request ID.
                                    Example:  "spa-4f99573d74ae1"
                              required:
                                - action
                                - shop_number
                            header: {}
                            config:
                              hideRoot: true
                          - type: text
                            data: '## Response'
                          - type: jsonSchema
                            data:
                              $ref: ./static/m_get_orders_01.oas2.yml#/definitions/.main
                            header:
                              subtitle: application/json
                          - type: text
                            data: |-
                              ## Error Codes

                              Code|Description
                              ---|---
                              101|Unknown action
                              103|"shop_number" not set
                              110|Merchant not found
                              113|Shop not found
                              118|Missing parameters
                              123|Following parameters of wrong type: [...]
                              400|Authorization not set
                              400|Authorization not set
                              401|Authorization username invalid format
                              402|Generated authorization password invalid
                              403|Generated authorization is too old
                              404|The given OAuth2 access token is invalid
                              405|Shop has no rights to access API. Make sure your contract is valid
                              999|Unknown error
                          - type: text
                            data: '## Example'
                          - type: code
                            data: |-
                              {
                                  "error_text": null,
                                  "error": 0,
                                  "sma_version": "1.0",
                                  "trace_id": "spa-4f99573d74ae1",
