                    - title: check_stock
                      route:
                        path: /check-stock
                      data:
                        blocks:
                          - type: text
                            data: Check current stock quantity of the product and returns available amount.
                            header:
                              token: POST
                              title: check_stock
                          - type: text
                            data: '## Query parameters'
                          - type: jsonSchema
                            data:
                              type: object
                              properties:
                                action:
                                  type: string
                                  description: Requested method
                                shop_number:
                                  type: string
                                  description: |-
                                    Your shop number.
                                    Example: "11413"
                                trace_id:
                                  type: string
                                  description: |-
                                    Unique request trace ID.
                                    Example:  "sma-9412"
                                items:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      item:
                                        type: object
                                        properties:
                                          item_number:
                                            type: string
                                            description: |-
                                              Item number.
                                              Example: "100001732"
                                          item_number_public:
                                            type: string
                                            description: |-
                                              Public item number.
                                              Example: "ams008"
                                          internal_order_info:
                                            type: string
                                            description: |-
                                              Additional item information to be transmitted when the item is ordered. E.g. internal IDs or additional information.
                                              Example: "WWS number: "1234567"
                                          options:
                                            type: array
                                            description: |-
                                              --not yet implemented--
                                              Array with item options
                                            items:
                                              type: object
                                              properties:
                                                option:
                                                  type: object
                                                  properties:
                                                    option_number:
                                                      type: string
                                                      description: |-
                                                        Corresponds with the option ID in the shop system.
                                                        Example: "13"
                                                    name:
                                                      type: string
                                                      description: |-
                                                        Name of the option.
                                                        Example:  "Color"
                                                    value_number:
                                                      type: string
                                                      description: |-
                                                        Corresponds with the value ID in the shop system.
                                                        Example: "154"
                                                    value:
                                                      type: string
                                                      description: |-
                                                        Chosen option
                                                        Example: "blue"
                                                    additional_amount_with_tax:
                                                      type: number
                                                      description: Additional amount with tax
                                                  required:
                                                    - value
                                                    - additional_amount_with_tax
                                          inputs:
                                            type: array
                                            description: |-
                                              --not yet implemented--
                                              This array includes the item's corresponding input fields
                                            items:
                                              type: object
                                              properties:
                                                input:
                                                  type: object
                                                  properties:
                                                    input_number:
                                                      type: string
                                                      description: |-
                                                        ID of the input field in the shop system.
                                                        Example: "23"
                                                    type:
                                                      type: string
                                                      description: |-
                                                        Allowed values: "text" and "image."
                                                        Example: "text"
                                                      pattern: text|image
                                                    additional_amount_with_tax:
                                                      type: number
                                                      description: |-
                                                        Additional amount with tax.
                                                        Example: 5.49
                                                    label:
                                                      type: string
                                                      description: |-
                                                        Name of the input field.
                                                        "Labeling (back side)"
                                                    user_input:
                                                      type: string
                                                      description: |-
                                                        User input.
                                                        Example: "My Peanut Butter"
                                                    info_text:
                                                      type: string
                                                      description: |-
                                                        Description of the input field.
                                                        Example: "The name will be printed on the front label - max. 18 characters"
                                                  required:
                                                    - input_number
                                                    - type
                                                    - additional_amount_with_tax
                                                    - label
                                                    - user_input
                                                    - info_text
                                        required:
