                    - title: cancel_order
                      route:
                        path: /cancel-order
                      config:
                        sidebar:
                          token: POST
                      data:
                        blocks:
                          - type: text
                            data: With this action you can cancel an order in whole or in part.
                            header:
                              token: POST
                              title: cancel_order
                          - type: text
                            data: '## Query parameters'
                          - type: jsonSchema
                            data:
                              type: object
                              properties:
                                action:
                                  type: string
                                  default: get_orders
                                  description: Requested method
                                shop_number:
                                  type: string
                                  description: |-
                                    Your shop number.
                                    Example: "10123"
                                cancel_complete_order:
                                  type: boolean
                                  description: 'Set to 1 to cancel the complete order including all items and shipping costs. (Default: 0)'
                                cancellation_items:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      cancellation_item:
                                        type: object
                                        properties:
                                          order_item_id:
                                            type: integer
                                            description: |-
                                              Required when item_number is not set. Item ID of the item to be cancelled.
                                              Note: This refers to the field "order_item_id" field in get_orders of the Shopgate Merchant API.
                                              Example: 1221321
                                          item_number:
                                            type: string
                                            description: |-
                                              Required when order_item_id is not set. Item number of the item to be cancelled. Will be ignored, if item_number is set.
                                              Example:  "AX29475H"
                                          quantity:
                                            type: integer
                                            description: Number of items to be cancelled.
                                cancel_shipping:
                                  type: boolean
                                  description: 'Cancel shipping costs as well? (Default: 0)'
                                cancel_note:
                                  type: string
                                  description: |-
                                    Note regarding the cancellation request.
                                    Example:  "Item is not in stock anymore."
                              required:
                                - action
                                - shop_number
                            header: {}
                            config:
                              hideRoot: true
                          - type: text
                            data: '## Response'
                          - type: jsonSchema
                            data:
                              $ref: ./static/m_cancel_order.oas2.yml#/definitions/.main
                            header:
                              subtitle: application/json
                          - type: text
                            data: |-
                              ## Error Codes

                              Code|Description
                              ---|---
                              101|Unknown action
                              103|"shop_number" not set
                              110|Merchant not found
                              113|Shop not found
                              118|Missing parameters
                              123|Following parameters of wrong type: [...]
                              201|Order not found
                              222|Order already cancelled
                              223|Try to cancel invalid item
                              224|Try to cancel invalid quantity of items
                              225|Shipping costs already cancelled
                              226|Invalid cancellation arguments
                              400|Authorization not set
                              401|Authorization username invalid format
                              402|Generated authorization password invalid
                              403|Generated authorization is too old
                              404|The given OAuth2 access token is invalid
                              405|Shop has no rights to access API. Make sure your contract is valid
                              803|Internal error occurred while saving
                              999|Unknown error
                          - type: text
                            data: '## Example'
                          - type: code
                            data: |-
                              {
                                  error: 0, 
                                  error_text: null,
                                  cancellation_number: "1010001596",
                                  version: "1.0",
                                  trace_id: "spa-4f7ab2d146165"
                              }
                            config:
                              mode: json
