                                  default: get_items
                                shop_number:
                                  type: string
                                  description: |-
                                    Your shop number.
                                    Example: "11413"
                                offset:
                                  type: integer
                                  description: 'Number of items (not item number, etc) to be skipped in the export.'
                                limit:
                                  type: integer
                                  description: Maximum number of items to be exported.
                                trace_id:
                                  type: string
                                  description: |-
                                    Unique request trace ID.
                                    Example: "sma-9412"
                                "uids\t":
                                  type: array
                                  description: |-
