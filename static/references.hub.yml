                    - title: ' get_categories'
                      route:
                        path: /get-categories
                      data:
                        blocks:
                          - type: text
                            data: 'This allows you to export item categories from your shop system to the [Shopgate Categories XML Format](/references/cart-integration/catalog-data-feed/category-xml).'
                            header:
                              token: POST
                              title: ' get_categories'
                          - type: text
                            data: '## Query parameters'
                          - type: jsonSchema
                            data:
                              type: object
                              properties:
                                action:
                                  type: string
                                  default: get_categories
                                  description: Requested method
                                shop_number:
                                  type: string
                                  description: |-
                                    Your shop number.
                                    Example: "11413"
                                trace_id:
                                  type: string
                                  description: |-
                                    Unique request trace ID.
                                    Example: "sma-9412"
                              required:
                                - action
                                - shop_number
                                - trace_id
                            header: {}
                            config:
                              hideRoot: true
                          - type: text
                            data: '## Response'
                          - type: jsonSchema
                            data:
                              $ref: ./static/pi_export_10_get_categories.oas2.yml#/definitions/.main
                            header:
                              subtitle: application/json
                          - type: text
                            data: '## Plugin Example'
                          - type: code
                            data: "<?\n    class MyPlugin extends ShopgatePlugin\n    {\n        ......\n    \n        protected function createCategories($limit = null, $offset = null, array $uids = array ())\n        {\n            /**\n             * init category model\n             */\n            $categoryItem = new Shopgate_Model_Catalog_Category();\n     \n            $categoryItem->setUid(10);\t\t\t\t\t\t\t\t\t        /** required */\n            $categoryItem->setName('Example Category');\t\t\t\t\t\t    /** required */\n            $categoryItem->setParentUid(4);\t\t\t\t\t\t\t\t        /** optional */\n            $categoryItem->setIsActive(true);\t\t\t\t\t\t\t\t    /** optional | default false */\n            $categoryItem->setDeeplink('http://example-shop/category/id/10');   /** optional */\n            $categoryItem->setIsAnchor(true);\t\t\t\t\t\t\t\t    /** optional | default false */\n            $categoryItem->setSortOrder(10);\t\t\t\t\t\t\t\t    /** optional */\n     \n            /**\n             * init image model\n             */\n            $imageItem = new Shopgate_Model_Media_Image();\n     \n            $imageItem->setUid(10);\t\t\t\t\t\t\t\t\t\t\t        /** required */\n            $imageItem->setSortOrder(10);\t\t\t\t\t\t\t\t\t        /** optional */\n            $imageItem->setAlt('Example Alt 1');\t\t\t\t\t\t\t\t    /** optional */\n            $imageItem->setUrl('http://example-shop/category/id/10/image/id/10');\t/** optional */\n            $imageItem->setTitle('Example Title 1');\t\t\t\t\t\t\t\t/** required */\n     \n            /**\n             * add to category model\n             */\n            $categoryItem->setImage($imageItem);\n            $this->addCategoryModel($categoryItem);\n        }"
                            config:
                              mode: php
                          - type: text
                            data: '## Plugin Example Result'
                          - type: code
                            data: |-
                              <categories xsi:noNamespaceSchemaLocation="http://files.shopgate.com/xml/xsd/catalog/categories.xsd">
                                  <category uid="10" sort_order="10" parent_uid="4" is_active="1" is_anchor="1">
                                      <name>
                                          <![CDATA[
                                          Example Category
                                          ]]>
                                      </name>
                                      <deeplink>http://example-shop/category/id/10</deeplink>
                                      <image uid="10" sort_order="10">
                                          <url>
                                              <![CDATA[
                                              http://example-shop/category/id/10/image/id/10
                                              ]]>
                                          </url>
                                          <title>
                                              <![CDATA[
                                              Example Title 1
                                              ]]>
                                          </title>
                                          <alt>
                                              <![CDATA[
                                              Example Alt 1
                                              ]]>
                                          </alt>
                                      </image>
                                  </category>
                              </categories>
                            config:
                              mode: xml
