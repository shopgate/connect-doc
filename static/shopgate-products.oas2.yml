swagger: '2.0'
x-stoplight:
  id: cgycd2v675m06
info:
  title: Shopgate Products Pipelines
  version: '1.1'
  description: 
basePath: /
produces:
  - application/json
consumes:
  - application/json
paths:
  /shopgate.cms.getPageConfig.v1:
    post:
      operationId: pipelines/shopgate.cms.getPageConfig.v1
      summary: Retrieve the page configuration for the given pageId.
      description: |
        This pipeline returns the page configuration for one specific page, the ID of the page is passed through the pageId parameter.
        The 'title' property is only set, if the particular page has a title.
        The 'widgets' key holds an array of widget- or widget-grid-objects, that bring their own settings with them.
      parameters:
        - name: pageId
          in: body
          required: true
          schema:
            type: object
            properties:
              pageId:
                type: string
                description: 'The pageId of the page, the device wants to display.'
      responses:
        ok:
          description: Successful response.
          schema:
            type: object
            required:
              - output
            properties:
              output:
                properties:
                  title:
                    type: string
                  widgets:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: 'The widget-type, like @shopgate/commerce-widgets/image-slider or @shopgate/commerce-widgets/widget-grid.'
                        height:
                          type: integer
                          format: int32
                          description: 'The number of rows, this widget uses inside the grid or widget-grid.'
                        settings:
                          type: object
                          description: 'The widget-specific conguration data, every type has it''s own properties for this.'
        EUNKNOWN:
          description: An internal error occured.
          schema:
            $ref: '#/definitions/UnknownError'
          examples:
            application/json:
              error:
                code: EUNKNOWN
                message: An internal error occured.
      tags:
        - CMS
      x-stoplight:
        id: biphyw9qkqssu
  /shopgate.cms.getMenu.v1:
    post:
      operationId: pipelines/shopgate.cms.getMenu.v1
      summary: Retrieves additional entries for the app menu.
      description: |
        This pipeline returns the additional entries for the service menu that will be shown, when clicking the hamburger icon in the android app or "More" on iOS.
        When there are no entries available for that shop the entries property will contain an empty array.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              id:
                type: string
                description: Id of the menu that is supposed to be fetched.
      responses:
        ok:
          description: Successful response.
          schema:
            type: object
            required:
              - output
            properties:
              output:
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          description: 'Link to the page to be opened when the user clicks on the menu entry (only path, does not include the baseUrl)'
                        label:
                          type: string
                          description: Name to be shown in the menu
        EUNKNOWN:
          description: An internal error occured.
          schema:
            $ref: '#/definitions/UnknownError'
          examples:
            application/json:
              error:
                code: EUNKNOWN
                message: An internal error occured.
      tags:
        - CMS
      x-stoplight:
        id: gj1x5qiuttr5n
  /shopgate.catalog.getFilters.v1:
    post:
      operationId: pipelines/shopgate.catalog.getFilters.v1
      summary: 'getProduct.v1'
      description: |-
        This pipeline retrieves the possible filters, for a specific category or searchPhrase.
        Only one of both filter methods can be used at once.
      parameters:
        - $ref: '#/parameters/categoryIdSearchPhraseFilters'
      responses:
        ok:
          description: Successful response.
          schema:
            type: object
            required:
              - output
            properties:
              output:
                properties:
                  filters:
                    type: array
                    items:
                      $ref: '#/definitions/Filter'
          examples:
            application/json:
              output:
                filters:
                  - id: filter23
                    label: Price range
                    type: range
                    minimum: 42
                    maximum: 876
        EUNKNOWN:
          description: An internal error occured.
          schema:
            $ref: '#/definitions/UnknownError'
          examples:
            application/json:
              error:
                code: EUNKNOWN
                message: An internal error occured.
      tags:
        - Catalog
      x-stoplight:
        id: ycgrfqygyz7or
  /shopgate.catalog.getTotalProductCount.v1:
    post:
      operationId: pipelines/shopgate.catalog.getTotalProductCount.v1
      summary: Searches for products and returns the count of those.
      description: |-
        This pipeline will utilize the same search mechanism as the 'getProducts_v1' pipeline, but will omit the products and extract the totalProductCount only. This is useful in cases where the actual product data is of no interest, because it is faster.
        It can be combined with filters, to preview the number of products, that would be found in a filter search.
      parameters:
        - $ref: '#/parameters/categoryIdSearchPhraseFilters'
      responses:
        ok:
          description: Successful response.
          schema:
            type: object
            required:
              - output
            properties:
              output:
                properties:
                  totalProductCount:
                    type: integer
                    format: int32
                    description: 'The number of products, that would be found when searching while using the given search parameters.'
          examples:
            application/json:
              output:
                totalProductCount: 300
        EUNKNOWN:
          description: An internal error occured.
          schema:
            $ref: '#/definitions/UnknownError'
          examples:
            application/json:
              error:
                code: EUNKNOWN
                message: An internal error occured.
      tags:
        - Catalog
      x-stoplight:
        id: eksnp60u7fby4
  /shopgate.catalog.getLiveshoppingProducts.v1:
    post:
      operationId: pipelines/shopgate.catalog.getLiveshoppingProducts.v1
      summary: 'Retrieves all products with a liveshopping timeframe, future, past and ongoing ones.'
      description: |-
        This pipeline will retrieve all products, that have a liveshopping timeframe. Not only active ones will be returned, but also the ones, which had such a timeframe in the past 7 days or will have one in the future. It's important for the frontend, to filter the products by active liveshopping.
        The additional products are there, to enable the frontend to show what the customer had missed, to show a countdown like "will be cheaper in 15 minutes" or to create similar features
      responses:
        ok:
          description: Successful response.
          schema:
            type: object
            required:
              - output
            properties:
              output:
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/definitions/BasicProduct'
          examples:
            application/json:
              output:
                products:
                  - id: string
                    active: true
                    availability:
                      text: string
                      state: ok
                    identifiers:
                      sku: string
                      ean: string
                      isbn: string
                      upc: string
                      pzn: string
                      mpn: string
                    manufacturer: string
                    name: string
                    stock:
                      info: string
                      orderable: true
                      quantity: 0
                      maxOrderQuantity: 0
                      minOrderQuantity: 0
                      ignoreQuantity: true
                    rating:
                      count: 0
                      average: 0
                      reviewCount: 0
                    featuredImageUrl: string
                    featuredImageBaseUrl: string
                    price:
                      tiers:
                        - from: 0
                          to: 0
                          unitPrice: 0
                      info: string
                      unitPrice: 0
                      unitPriceStriked: 0
                      unitPriceMin: 0
                      unitPriceMax: 0
                      unitPriceNet: 0
                      unitPriceWithTax: 0
                      taxAmount: 0
                      taxPercent: 0
                      msrp: 0
                      currency: USD
                    flags:
                      hasChildren: true
                      hasVariants: true
                      hasOptions: true
                    liveshoppings:
                      - from: '2017-11-11T00:00:00.000Z'
                        to: '2017-11-11T23:59:59.999Z'
                    highlight: true
                    characteristics:
                      - null
                    type: simple
                    tags:
                      - string
        EUNKNOWN:
          description: An internal error occured.
          schema:
            $ref: '#/definitions/UnknownError'
          examples:
            application/json:
              error:
                code: EUNKNOWN
                message: An internal error occured.
      tags:
        - Catalog
      x-stoplight:
        id: l9ko8pl70cdyt
