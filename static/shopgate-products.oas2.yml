  /shopgate.catalog.getProducts.v1:
    post:
      operationId: pipelines/shopgate.catalog.getProducts.v1
      summary: 'Retrieves a collection of products, based on some filters, categories or on a search.'
      description: |-
        This pipeline gives you a (paginated) product list. It can be used to either “search” for products or the content of categories. If the categoryId parameter is set, the searchPhrase will be ignored, to search inside a category (or more categories), you have to use filters combined with a search phrase.

        There are some undocumented input parameters, that are only used internally, but in theory you could use them too. These are the boolean parameters “skipHighlightLoading” and "skipLiveshoppingLoading" and will prevent the pipeline from loading there data to the products, for performance reasons or if you just don’t need these data, if you set them to true.
      parameters:
        - $ref: '#/parameters/categoryIdSearchPhraseFiltersOffsetLimitSort'
      responses:
        ok:
          description: Successful response.
          schema:
            type: object
            required:
              - output
            properties:
              output:
                properties:
                  totalProductCount:
                    type: integer
                    format: int32
                    description: 'The total number of products that were found, independent of the offset or limit'
                  products:
                    type: array
                    items:
                      $ref: '#/definitions/BasicProduct'
          examples:
            application/json:
              output:
                totalProductCount: 0
                products:
                  - id: string
                    active: true
                    availability:
                      text: string
                      state: ok
                    identifiers:
                      sku: string
                      ean: string
                      isbn: string
                      upc: string
                      pzn: string
                      mpn: string
                    manufacturer: string
                    name: string
                    stock:
                      info: string
                      orderable: true
                      quantity: 0
                      maxOrderQuantity: 0
                      minOrderQuantity: 0
                      ignoreQuantity: true
                    rating:
                      count: 0
                      average: 0
                      reviewCount: 0
                    featuredImageUrl: string
                    featuredImageBaseUrl: string
                    price:
                      tiers:
                        - from: 0
                          to: 0
                          unitPrice: 0
                      info: string
                      unitPrice: 0
                      unitPriceStriked: 0
                      unitPriceMin: 0
                      unitPriceMax: 0
                      unitPriceNet: 0
                      unitPriceWithTax: 0
                      taxAmount: 0
                      taxPercent: 0
                      msrp: 0
                      currency: USD
                    flags:
                      hasChildren: true
                      hasVariants: true
                      hasOptions: true
                    liveshoppings:
                      - from: '2017-11-11T00:00:00.000Z'
                        to: '2017-11-11T23:59:59.999Z'
                    highlight: true
                    characteristics:
