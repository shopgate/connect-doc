  /shopgate.catalog.getCategoryChildren.v1:
    post:
      operationId: pipelines/shopgate.catalog.getCategoryChildren.v1
      summary: Retrieve sub-categories for the given category id.
      description: This pipeline will retrieve the sub-categories of one specific category.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - categoryId
            properties:
              categoryId:
                type: string
                description: The categoryId for which you want to retrieve children
              sort:
                type: string
                enum:
                  - nameAsc
                  - nameDesc
                  - relevance
                default: relevance
                description: 'How to sort the result, if you use relevance the merchants shopsystem or import will decide the order'
      responses:
        ok:
          description: Successful response.
          schema:
            type: object
            properties:
              categories:
                type: array
                items:
                  $ref: '#/definitions/Category'
          examples:
            application/json:
              categories:
                - id: cat41
                  name: Category 41
                  productCount: 229
                  imageUrl: 'http://shopgate.cdn/category41.png'
      tags:
        - Catalog
      x-stoplight:
        id: eppre2hrq2gqi
  /shopgate.catalog.getCategory.v1:
    post:
      operationId: pipelines/shopgate.catalog.getCategory.v1
      description: |
        This pipeline will retrieve one specific category and, if "includeChildren" is set to true, it's
        child categories. If it's set to false, the "children" property will be set to an empty array.
        It will also add a property "parent", which holds the id and name of the parent category, of the
        retrieved one.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - categoryId
            properties:
              categoryId:
                type: string
                description: The categoryId of the category you want to retrieve
              includeChildren:
                type: boolean
                default: false
              childrenSort:
                type: string
                enum:
                  - nameAsc
                  - nameDesc
                  - relevance
                description: |
                  If children are included, they will be sorted by this.
                  If relevance is selected, the merchants shop system or import decides the order
      responses:
        ok:
          description: Successful response.
          schema:
            type: object
            properties:
              category:
                type: object
                allOf:
                  - $ref: '#/definitions/Category'
                  - type: object
                    required:
                      - parent
                    properties:
                      parent:
                        type: object
                        description: |
                          If the retrieved parent is not the root/default one, this will hold basic
                          information about the parent category, of the retrieved one.
                        properties:
                          id:
                            type: string
                            description: The id of the parent category
                          name:
                            type: string
                            description: The name of the parent category
                      children:
                        type: array
                        description: 'If includeChildren is true, this property will hold the child categories of the retrieved one'
                        items:
                          $ref: '#/definitions/Category'
                    example:
                      parent:
                        id: cat40
                        name: Category 40
                      children:
                        - id: cat42
                          name: Category 42
                          productCount: 23
                          imageUrl: 'http://shopgate.cdn/category42.png'
          examples:
            application/json:
              category:
                id: cat41
                name: Category 41
                productCount: 229
                imageUrl: 'http://shopgate.cdn/category41.png'
                parent:
                  id: cat40
                  name: Category 40
                children:
                  - id: cat42
                    name: Category 42
                    productCount: 23
                    imageUrl: 'http://shopgate.cdn/category42.png'
        EUNKNOWN:
          description: An internal error occured.
          examples: {}
      tags:
        - Catalog
      x-stoplight:
        id: c3x0j2nzdgi7w
