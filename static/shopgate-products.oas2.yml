  /shopgate.catalog.getProductImages.v2:
    post:
      operationId: pipelines/shopgate.catalog.getProductImages.v2
      summary: ''
      description: |
        This pipeline retrieves the product images. The BasicProduct, which is returned by getProduct and getProducts, only holds the first one.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - productId
              - formats
            properties:
              productId:
                type: string
                example: '1'
              formats:
                type: array
                items:
                  type: object
                  properties:
                    width:
                      type: integer
                      example: 1024
                    height:
                      type: integer
                      example: 1024
      responses:
        ok:
          description: Successful response.
          schema:
            type: object
            properties:
              images:
                type: array
                items:
                  type: object
                  description: 'For each format, an entry with images and the used format'
                  properties:
                    width:
                      type: integer
                      description: width of images
                    height:
                      type: integer
                      description: height of images
                    sources:
                      type: array
                      description: list of image urls
            example:
              images:
                - width: 440
                  height: 440
                - width: 1024
                  height: 1024
          examples:
            application/json:
              images:
                - width: 440
                  height: 440
                  sources:
